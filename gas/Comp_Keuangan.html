<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Pembayaran Keuangan</h1>
      <p class="text-sm text-slate-500 mt-1">Kelola transaksi SPP, Uang Gedung, dan jenis pembayaran lainnya</p>
    </div>
    <button onclick="Swal.fire('Fitur Input', 'Formulir input pembayaran sedang dikembangkan', 'info')" class="flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white hover:bg-emerald-700 font-medium rounded-lg transition-colors shadow-sm shadow-emerald-600/20 text-sm">
      <i class="fas fa-plus"></i> Transaksi Baru
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl shrink-0"><i class="fas fa-money-bill-wave"></i></div>
      <div><p class="text-xs text-slate-500 font-medium">Pemasukan Hari Ini</p><p class="font-bold text-slate-800 text-lg">Rp 2.500.000</p></div>
    </div>
    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl shrink-0"><i class="fas fa-file-invoice"></i></div>
      <div><p class="text-xs text-slate-500 font-medium">Transaksi Hari Ini</p><p class="font-bold text-slate-800 text-lg">15</p></div>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-4 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="relative max-w-md w-full">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" placeholder="Cari no transaksi atau nama siswa..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
      </div>
      <select class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none">
        <option value="">Semua Jenis</option>
        <option value="SPP">SPP Bulanan</option>
        <option value="Uang Gedung">Uang Gedung</option>
      </select>
    </div>
    
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-600">
        <thead class="bg-slate-50 border-b border-slate-200 text-slate-700 uppercase text-xs font-semibold">
          <tr>
            <th class="px-6 py-4">Tanggal & No. TRX</th>
            <th class="px-6 py-4">Siswa</th>
            <th class="px-6 py-4">Jenis Pembayaran</th>
            <th class="px-6 py-4">Jumlah</th>
            <th class="px-6 py-4">Status</th>
            <th class="px-6 py-4 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200" id="tableKeuanganBody">
          <tr><td colspan="6" class="text-center py-6 text-slate-400">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  function formatRupiah(angka) {
    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
  }

  function initPage() {
    google.script.run
      .withSuccessHandler(function(data) {
        var tbody = document.getElementById('tableKeuanganBody');
        
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400">Belum ada transaksi pembayaran.</td></tr>';
          return;
        }
        
        var html = '';
        data.forEach(function(k) {
          var statusClass = k.status === 'Lunas' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
          
          html += '<tr class="hover:bg-slate-50">';
          html += '  <td class="px-6 py-4"><p class="font-medium text-slate-800">' + k.noTransaksi + '</p><p class="text-xs text-slate-500">' + k.tanggal + '</p></td>';
          html += '  <td class="px-6 py-4"><p class="font-medium text-slate-800">' + k.nama + '</p><p class="text-xs text-slate-500">Kelas ' + k.kelas + '</p></td>';
          html += '  <td class="px-6 py-4">' + k.jenis + '</td>';
          html += '  <td class="px-6 py-4 font-mono font-medium text-slate-800">' + formatRupiah(k.jumlah) + '</td>';
          html += '  <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ' + statusClass + '">' + k.status + '</span></td>';
          html += '  <td class="px-6 py-4 text-right"><button class="text-slate-600 hover:bg-slate-100 p-2 rounded" title="Cetak Kuitansi"><i class="fas fa-print"></i></button></td>';
          html += '</tr>';
        });
        tbody.innerHTML = html;
      })
      .withFailureHandler(function(err) {
         document.getElementById('tableKeuanganBody').innerHTML = '<tr><td colspan="6" class="text-center py-6 text-red-500">Gagal memuat: ' + err.toString() + '</td></tr>';
      })
      .getKeuanganList();
  }
</script>
