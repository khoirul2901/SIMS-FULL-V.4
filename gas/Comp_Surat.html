<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Administrasi Surat Menyurat</h1>
      <p class="text-sm text-slate-500 mt-1">Kelola pembuatan dan arsip surat keluar</p>
    </div>
    <button onclick="Swal.fire('Info', 'Formulir pembuatan surat sedang dikembangkan', 'info')" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 font-medium rounded-lg transition-colors shadow-sm shadow-blue-600/20 text-sm">
      <i class="fas fa-plus"></i> Buat Surat Baru
    </button>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-4 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="relative max-w-md w-full">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" placeholder="Cari nomor surat, jenis, atau tujuan..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <select class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none">
        <option value="">Semua Jenis Surat</option>
        <option value="Surat Keterangan">Surat Keterangan</option>
        <option value="Surat Tugas">Surat Tugas</option>
      </select>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-600">
        <thead class="bg-slate-50 border-b border-slate-200 text-slate-700 uppercase text-xs font-semibold">
          <tr>
            <th class="px-6 py-4">No. Surat</th>
            <th class="px-6 py-4">Jenis Surat</th>
            <th class="px-6 py-4">Tujuan</th>
            <th class="px-6 py-4">Tanggal</th>
            <th class="px-6 py-4">Status</th>
            <th class="px-6 py-4 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200" id="tableSuratBody">
          <tr><td colspan="6" class="text-center py-6 text-slate-400">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  function initPage() {
    google.script.run
      .withSuccessHandler(function(data) {
        var tbody = document.getElementById('tableSuratBody');
        
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400">Tidak ada riwayat pembuatan surat.</td></tr>';
          return;
        }
        
        var html = '';
        data.forEach(function(s) {
          var statusClass = s.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
          
          html += '<tr class="hover:bg-slate-50">';
          html += '  <td class="px-6 py-4 font-mono font-medium text-slate-800">' + s.noSurat + '</td>';
          html += '  <td class="px-6 py-4"><div class="flex items-center gap-2"><i class="fas fa-file-alt text-slate-400"></i><span>' + s.jenis + '</span></div></td>';
          html += '  <td class="px-6 py-4">' + s.tujuan + '</td>';
          html += '  <td class="px-6 py-4 text-slate-500">' + s.tanggal + '</td>';
          html += '  <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ' + statusClass + '">' + s.status + '</span></td>';
          html += '  <td class="px-6 py-4 text-right"><button class="text-blue-600 hover:bg-blue-50 p-2 rounded" title="Cetak/Download"><i class="fas fa-print"></i></button></td>';
          html += '</tr>';
        });
        tbody.innerHTML = html;
      })
      .withFailureHandler(function(err) {
         document.getElementById('tableSuratBody').innerHTML = '<tr><td colspan="6" class="text-center py-6 text-red-500">Gagal memuat: ' + err.toString() + '</td></tr>';
      })
      .getSuratList();
  }
</script>
