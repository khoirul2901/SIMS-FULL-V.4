<div class="space-y-6 max-w-4xl">
  <div>
    <h1 class="text-2xl font-bold text-slate-800">Pengaturan Sistem</h1>
    <p class="text-sm text-slate-500 mt-1">Konfigurasi dasar aplikasi dan tahun ajaran</p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-8">
    
    <!-- Identitas Sekolah -->
    <section>
      <h3 class="font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">Identitas Sekolah</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nama Sekolah</label>
          <input type="text" value="SMP AL-HIKAM" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">NPSN</label>
          <input type="text" value="20541234" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Lengkap</label>
          <textarea rows="2" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none">Jl. Raya Tunjung No. 12, Burneh, Bangkalan, Jawa Timur</textarea>
        </div>
      </div>
    </section>

    <!-- Tahun Ajaran -->
    <section>
      <h3 class="font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">Tahun Ajaran Aktif</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tahun Ajaran</label>
          <select class="w-full px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none">
            <option>2023/2024</option>
            <option selected>2024/2025</option>
            <option>2025/2026</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Semester</label>
          <select class="w-full px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none">
            <option selected>Ganjil</option>
            <option>Genap</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Integrasi Database -->
    <section>
      <h3 class="font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">Database Spreadsheet</h3>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Google Spreadsheet ID</label>
        <div class="flex gap-2">
          <input type="password" value="****************************************" disabled class="w-full px-4 py-2 bg-slate-100 border border-slate-200 rounded-lg text-sm text-slate-500">
          <button class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium">Ubah</button>
        </div>
        <p class="text-xs text-slate-500 mt-1">ID Spreadsheet dikonfigurasi langsung melalui script backend Code.gs untuk keamanan.</p>
      </div>
    </section>

    <div class="flex justify-end pt-4 border-t border-slate-100">
      <button onclick="Swal.fire('Tersimpan', 'Pengaturan berhasil diperbarui', 'success')" class="px-6 py-2 bg-emerald-600 text-white hover:bg-emerald-700 font-medium rounded-lg transition-colors text-sm">
        Simpan Perubahan
      </button>
    </div>

  </div>
</div>
