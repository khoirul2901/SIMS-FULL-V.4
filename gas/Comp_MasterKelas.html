<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Master Data Kelas</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 dark:text-slate-500 mt-1">Kelola data kelas dan rombongan belajar</p>
    </div>
        <div class="flex flex-wrap items-center gap-2 mt-4 sm:mt-0">
      <button onclick="showModalKelas(false)" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 font-medium rounded-lg transition-colors shadow-sm shadow-indigo-600/20 text-sm">
        <i class="fas fa-plus"></i> Tambah Kelas
      </button>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
    <div class="p-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="relative max-w-md w-full">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
        <input type="text" placeholder="Cari nama kelas..." class="w-full pl-9 pr-4 py-2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
    </div>
    
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-600 dark:text-slate-300">
        <thead class="bg-slate-50 dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 uppercase text-xs font-semibold">
          <tr>
            <th class="px-6 py-4">Kode Kelas</th>
            <th class="px-6 py-4">Nama Kelas</th>
            <th class="px-6 py-4">Wali Kelas</th>
            <th class="px-6 py-4 text-center">Jml Siswa</th>
            <th class="px-6 py-4 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200" id="tableKelasBody">
          <tr><td colspan="5" class="text-center py-6 text-slate-400 dark:text-slate-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Tambah/Edit Kelas -->
  <div id="modalKelas" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-slate-200 dark:border-slate-800 transform scale-95 opacity-0 transition-all duration-300" id="modalKelasContent">
      <div class="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100" id="modalKelasTitle">Tambah Kelas Baru</h3>
        <button onclick="hideModalKelas()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <form id="formKelas" onsubmit="handleSaveKelas(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Kode Kelas</label>
          <input type="text" id="kelasKode" required class="w-full px-4 py-2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Nama Kelas</label>
          <input type="text" id="kelasNama" required class="w-full px-4 py-2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Wali Kelas</label>
          <input type="text" id="kelasWali" required class="w-full px-4 py-2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" onclick="hideModalKelas()" class="px-4 py-2 text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-medium rounded-lg transition-colors">Batal</button>
          <button type="submit" id="btnSaveKelas" class="px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 font-medium rounded-lg transition-colors">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  
  function showModalKelas(kelas) {
    var modal = document.getElementById('modalKelas');
    var content = document.getElementById('modalKelasContent');
    
    if (kelas && kelas.kode) {
      document.getElementById('modalKelasTitle').innerText = 'Edit Kelas';
      document.getElementById('kelasKode').value = kelas.kode;
      document.getElementById('kelasKode').readOnly = true;
      document.getElementById('kelasNama').value = kelas.nama;
      document.getElementById('kelasWali').value = kelas.waliKelas;
    } else {
      document.getElementById('modalKelasTitle').innerText = 'Tambah Kelas Baru';
      document.getElementById('formKelas').reset();
      document.getElementById('kelasKode').readOnly = false;
    }
    
    modal.classList.remove('hidden');
    setTimeout(() => {
      content.classList.remove('scale-95', 'opacity-0');
      content.classList.add('scale-100', 'opacity-100');
    }, 10);
  }
  
  function hideModalKelas() {
    var modal = document.getElementById('modalKelas');
    var content = document.getElementById('modalKelasContent');
    
    content.classList.remove('scale-100', 'opacity-100');
    content.classList.add('scale-95', 'opacity-0');
    setTimeout(() => {
      modal.classList.add('hidden');
    }, 300);
  }
  
  function handleSaveKelas(e) {
    e.preventDefault();
    var btn = document.getElementById('btnSaveKelas');
    var originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
    btn.disabled = true;
    
    var data = {
      kode: document.getElementById('kelasKode').value,
      nama: document.getElementById('kelasNama').value,
      waliKelas: document.getElementById('kelasWali').value
    };
    
    google.script.run
      .withSuccessHandler(function(res) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        
        if (res.success) {
          Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: res.message,
            timer: 1500,
            showConfirmButton: false
          });
          hideModalKelas();
          initPage();
        } else {
          Swal.fire('Gagal', res.message || 'Terjadi kesalahan', 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        Swal.fire('Error', err.toString(), 'error');
      })
      .saveKelas(data);
  }
  
  function editKelas(btn, dataStr) {
    var data = JSON.parse(decodeURIComponent(dataStr));
    showModalKelas(data);
  }
  
  function deleteKelasRow(kode, nama) {
    Swal.fire({
      title: 'Hapus Kelas?',
      text: `Anda yakin ingin menghapus kelas ${nama}?`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#ef4444',
      cancelButtonColor: '#64748b',
      confirmButtonText: 'Ya, Hapus!'
    }).then((result) => {
      if (result.isConfirmed) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              Swal.fire('Terhapus!', res.message, 'success');
              initPage();
            } else {
              Swal.fire('Gagal', res.message, 'error');
            }
          })
          .withFailureHandler(function(err){ Swal.fire('Error', err.toString(), 'error'); })
          .deleteKelas(kode);
      }
    });
  }

  function initPage() {
    google.script.run
      .withSuccessHandler(function(data) {
        var tbody = document.getElementById('tableKelasBody');
        
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-400 dark:text-slate-500">Tidak ada data kelas ditemukan.</td></tr>';
          return;
        }
        
        var html = '';
        data.forEach(function(k) {
          html += '<tr class="hover:bg-slate-50 dark:hover:bg-slate-800 border-b border-slate-200 dark:border-slate-800 last:border-0">';
          html += '  <td class="px-6 py-4 font-mono text-slate-800 dark:text-slate-100">' + k.kode + '</td>';
          html += '  <td class="px-6 py-4 font-medium text-slate-900 dark:text-slate-100">' + k.nama + '</td>';
          html += '  <td class="px-6 py-4">' + k.waliKelas + '</td>';
          html += '  <td class="px-6 py-4 text-center"><span class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 font-medium">' + k.jumlahSiswa + '</span></td>';
          html += '  <td class="px-6 py-4 text-right">';
          html += '    <button onclick="editKelas(this, \'' + encodeURIComponent(JSON.stringify(k)) + '\')" class="text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 p-2 rounded transition-colors" title="Edit"><i class="fas fa-edit"></i></button>';
          html += '    <button onclick="deleteKelasRow(\'' + k.kode + '\', \'' + k.nama + '\')" class="text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded transition-colors ml-2" title="Hapus"><i class="fas fa-trash"></i></button>';
          html += '  </td>';
          html += '</tr>';
        });
        tbody.innerHTML = html;
      })
      .withFailureHandler(function(err) {
         document.getElementById('tableKelasBody').innerHTML = '<tr><td colspan="5" class="text-center py-6 text-red-500">Gagal memuat: ' + err.toString() + '</td></tr>';
      })
      .getKelasList();
  }
</script>
