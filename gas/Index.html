          </button>
          <div class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 flex items-center justify-center font-bold" id="userInitial">

    <!-- Overlay untuk mobile sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/50 z-10 hidden md:hidden"></div>

    <script>
      // State Aplikasi Client Side
      
      function toggleTheme() {
        if (document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
          document.getElementById('themeIcon').classList.replace('fa-sun', 'fa-moon');
        } else {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
          document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
        }
      }

      // Initialize theme
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.addEventListener('DOMContentLoaded', () => {
          const icon = document.getElementById('themeIcon');
          if (icon) icon.classList.replace('fa-moon', 'fa-sun');
        });
      }

      var currentPage = '<?= page ?>';
      
      // Inisialisasi
      document.addEventListener('DOMContentLoaded', function() {
        setupMobileMenu();
        checkAuth();
        loadPage(currentPage);
      });
      
      function checkAuth() {
        var user = sessionStorage.getItem('user');
        if(!user) {
          // Redirect ke login
          google.script.run.withSuccessHandler(function(url){
             window.top.location.href = url + '?page=login';
          }).getAppUrl();
        } else {
          var userData = JSON.parse(user);
          document.getElementById('userInitial').innerText = userData.name.charAt(0).toUpperCase();
        }
      }

      function loadPage(pageName) {
        currentPage = pageName;
        updateActiveNav(pageName);
        
        var container = document.getElementById('app-container');
        container.innerHTML = '<div class="flex items-center justify-center h-full"><i class="fas fa-circle-notch fa-spin text-3xl text-indigo-600"></i></div>';
        
        // Panggil GAS untuk mengambil HTML komponen
        google.script.run
                    .withSuccessHandler(function(html) {
            container.innerHTML = html;
            
            // Execute scripts inside the injected HTML
            var scripts = container.getElementsByTagName('script');
            for (var i = 0; i < scripts.length; i++) {
              var script = document.createElement('script');
              if (scripts[i].src) {
                script.src = scripts[i].src;
              } else {
                script.innerHTML = scripts[i].innerHTML;
              }
              document.body.appendChild(script);
            }
            
            // Jika halaman yang diload memiliki fungsi inisialisasi, panggil fungsi tersebut
            setTimeout(function() {
              if (typeof initPage === 'function') {
                initPage();
              }
            }, 100);
          })
          .withFailureHandler(function(err) {
            container.innerHTML = '<div class="bg-red-50 text-red-600 p-4 rounded-lg">Gagal memuat halaman: ' + err.toString() + '</div>';
          })
          .getComponentHtml(pageName); // Kita perlu buat fungsi ini di Code.gs
          
        // Close sidebar on mobile
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.add('hidden');
      }
      
      function updateActiveNav(pageName) {
        var items = document.querySelectorAll('.nav-item');
        items.forEach(function(item) {
          if (item.getAttribute('data-page') === pageName) {
            item.classList.add('bg-indigo-600', 'text-white');
            item.classList.remove('text-slate-400');
            
            // Update Header
            document.getElementById('headerTitle').innerText = item.querySelector('span').innerText;
          } else {
            item.classList.remove('bg-indigo-600', 'text-white');
            item.classList.add('text-slate-400');
          }
        });
      }

      function handleLogout() {
        sessionStorage.removeItem('user');
        google.script.run.withSuccessHandler(function(url){
           window.top.location.href = url + '?page=login';
        }).getAppUrl();
      }
      
      function setupMobileMenu() {
        var openBtn = document.getElementById('openSidebar');
        var closeBtn = document.getElementById('closeSidebar');
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebarOverlay');
        
        openBtn.addEventListener('click', function() {
          sidebar.classList.remove('-translate-x-full');
          overlay.classList.remove('hidden');
        });
        
        closeBtn.addEventListener('click', function() {
          sidebar.classList.add('-translate-x-full');
          overlay.classList.add('hidden');
        });
        
        overlay.addEventListener('click', function() {
          sidebar.classList.add('-translate-x-full');
          overlay.classList.add('hidden');
        });
      }
    </script>
